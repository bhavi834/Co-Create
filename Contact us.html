<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Mera logo.jpg">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
            /* UPDATED BACKGROUND */
            background: url('pic contact.webp') no-repeat center center fixed;
            background-size: cover;
        }
        /* UPDATED OVERLAY + BLUR */
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(4px);
            z-index: -1;
        }
        /* NAVBAR */
        
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .logo {
            width: 45px;
            cursor: pointer;
        }
        
        .nav-links button {
            padding: 8px 15px;
            margin-left: 10px;
            border: none;
            cursor: pointer;
            background: #007bff;
            color: white;
            border-radius: 5px;
        }
        
        .nav-links button:hover {
            background: #0056b3;
        }
        
        .container {
            max-width: 900px;
            margin: 30px auto;
        }
        
        h1 {
            text-align: center;
        }
        /* GLASS EFFECT CARD */
        
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }
        
        button.submit-btn {
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        
        button.submit-btn:hover {
            background: #218838;
        }
        
        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <img src="Mera logo.jpg" class="logo" onclick="goDashboard()">

        <div class="nav-links">
            <button onclick="goDashboard()"><- Back to Dashboard</button>

        </div>
    </div>

    <div class="container">

        <h1>📞 Contact Us</h1>

        <!-- Contact Info -->
        <div class="card">
            <h2>Our Details</h2>
            <p><b>Email:</b> support@cocreate.com</p>
            <p><b>Phone:</b> +91 7417366547</p>
            <p><b>Location:</b> Jaipur, India</p>
        </div>

        <!-- Feedback -->
        <div class="card">
            <h2>💬 Feedback</h2>

            <input id="fbName" placeholder="Your Name">
            <input id="fbEmail" placeholder="Your Email">

            <select id="rating">
            <option value="">Rate Us</option>
            <option>⭐</option>
            <option>⭐⭐</option>
            <option>⭐⭐⭐</option>
            <option>⭐⭐⭐⭐</option>
            <option>⭐⭐⭐⭐⭐</option>
        </select>

            <textarea id="fbMessage" placeholder="Your Feedback"></textarea>

            <button class="submit-btn" onclick="submitFeedback()">Submit Feedback</button>
            <p id="fbSuccess" class="success"></p>
        </div>

        <!-- Query -->
        <div class="card">
            <h2>❓ Raise a Query</h2>

            <input id="qName" placeholder="Your Name">
            <input id="qEmail" placeholder="Your Email">
            <input id="qSubject" placeholder="Subject">

            <textarea id="qMessage" placeholder="Write your query..."></textarea>

            <button class="submit-btn" onclick="submitQuery()">Submit Query</button>
            <p id="qSuccess" class="success"></p>
        </div>

    </div>

    <script>
        function goDashboard() {
            window.location.href = "main webpage.html";
        }

        function goSearch() {
            window.location.href = "search.html";
        }

        function goCreate() {
            window.location.href = "create.html";
        }

        function submitFeedback() {
            const feedback = {
                name: fbName.value,
                email: fbEmail.value,
                rating: rating.value,
                message: fbMessage.value
            };

            if (!feedback.name || !feedback.email || !feedback.rating || !feedback.message) {
                alert("Please fill all fields");
                return;
            }

            let feedbacks = JSON.parse(localStorage.getItem("feedbacks")) || [];
            feedbacks.push(feedback);
            localStorage.setItem("feedbacks", JSON.stringify(feedbacks));

            fbSuccess.innerText = "✅ Feedback Submitted!";
            fbName.value = "";
            fbEmail.value = "";
            rating.value = "";
            fbMessage.value = "";
        }

        function submitQuery() {
            const query = {
                name: qName.value,
                email: qEmail.value,
                subject: qSubject.value,
                message: qMessage.value
            };

            if (!query.name || !query.email || !query.subject || !query.message) {
                alert("Please fill all fields");
                return;
            }

            let queries = JSON.parse(localStorage.getItem("queries")) || [];
            queries.push(query);
            localStorage.setItem("queries", JSON.stringify(queries));

            qSuccess.innerText = "✅ Query Submitted!";
            qName.value = "";
            qEmail.value = "";
            qSubject.value = "";
            qMessage.value = "";
        }
    </script>

</body>

</html>
