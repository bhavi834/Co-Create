<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register - Co Create</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #1e3c72, #2a5298);
        }
        
        .register-card {
            border-radius: 20px;
            transition: 0.3s ease;
        }
        
        .register-card:hover {
            transform: scale(1.02);
        }
        
        .logo {
            width: 220px;
        }
        
        .brand-title {
            font-weight: 400;
            color: #1e3c72;
        }
        
        .btn-primary {
            background-color: #1e3c72;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #16325c;
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card register-card shadow-lg p-4 text-center" style="width: 450px;">

            <img src="New Logo.png" class="logo mx-auto d-block mb-2">

            <h5 class="brand-title mb-3">
                Bringing skilled minds together to turn ideas into real outcomes.
            </h5>

            <h5 class="mb-4">Create Account</h5>

            <!-- Form -->
            <form action="register_backend.php" method="POST" enctype="multipart/form-data" class="text-start">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Select Role</label>
                    <select name="role" class="form-select" required>
                    <option value="student">Student</option>
                    <option value="admin">Admin</option>
                </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Upload Profile Photo</label>
                    <input type="file" name="profile_photo" class="form-control" accept="image/*" required>
                </div>

                <button type="button" class="btn btn-primary w-100" onclick="window.location.href= 'Submit.html'">
    Register
</button>

                <p class="text-center mt-3">
                    Already have an account?
                    <a href="Submit.html">Login</a>
                </p>
            </form>
        </div>
    </div>

</body>

</html>
